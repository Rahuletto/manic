[build]
command = "bun run build"
publish = "dist"

[functions]
directory = "netlify/functions"

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api"
status = 200

[[redirects]]
from = "/openapi.json"
to = "/.netlify/functions/api"
status = 200

[[redirects]]
from = "/docs/*"
to = "/.netlify/functions/api"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
